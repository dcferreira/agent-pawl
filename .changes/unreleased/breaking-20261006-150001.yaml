kind: breaking
body: '`pawl validate` now rejects a negative `max_length:`, a `max_length:` on a key that is not `type: string`, and a `state:` `default:` longer than its `max_length:` (rule 29). A typed `writes:` entry now accepts only `type:` and `max_length:`, and any other field, previously ignored, is a load error.'
