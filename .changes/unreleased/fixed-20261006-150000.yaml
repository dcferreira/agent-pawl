kind: fixed
body: '`max_length:` is now enforced: a `string` write longer than the cap (counted in Unicode code points) is rejected exactly like a type mismatch, so an agentic step retries with the reason in `last_error`. The cap applies on `state:` entries and on typed `writes:` entries, whose `max_length:` was previously dropped silently.'
