kind: added
body: '`foreach:` now runs `agentic` bodies: each item is dispatched in one `DISPATCH_PARALLEL` and answered with the new `pawl submit --item N`, and a body''s `attempts:` is a per-item budget that re-dispatches only the failed item (see `docs/examples/foreach-agentic`).'
