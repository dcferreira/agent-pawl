kind: breaking
body: A stdout TOKEN may name an author-declared outcome, `failure` (always, no `catch:` needed) or `success` (only if declared under `outcomes:`); the engine-owned `exhausted`, `timeout`, `partial` and `chosen` are never routable from stdout, even when declared, and are now unintelligible stdout (a hard failure). `catch:` no longer makes a token routable.
