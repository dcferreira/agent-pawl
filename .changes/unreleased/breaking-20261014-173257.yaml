kind: breaking
body: 'Agentic `pawl submit` coercion is strict: an `integer` key rejects non-integral or out-of-range numbers (the step retries with the reason in `last_error`) instead of truncating, a number written to a `string` key keeps its own text instead of e.g. `1e+06`, and trailing data after the JSON object is rejected; a pairs-sourced `json` value must be exactly one JSON value.'
