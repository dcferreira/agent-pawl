kind: security
body: DISPATCH/ASK/TERMINAL/WAIT output now neutralises every control character except newline and tab (ESC/ANSI sequences, VT, FF, 0x1C–0x1E, DEL), U+0085 and the bidi controls into visible escapes, so context bodies or state values can no longer spoof an instruction line in renderers that honour them.
