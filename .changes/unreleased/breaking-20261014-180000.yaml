kind: breaking
body: 'The CLI contract is now frozen and uniform. Every command parses flags the same way: `--flag value` and `--flag=value` both work, an empty value is an error (except `pawl abandon --reason`), a repeated flag is now an error (exit 2) instead of last-wins, and `-h`/`--help` prints that command''s usage and exits 0 (also `pawl help`, `pawl --help`, `pawl -h`). Exit codes are one table: 0 ok, 1 not found/ambiguous, 2 your input is wrong (usage or an invalid workflow), 3 run blocked, 4 refused, 5 internal or environment error; a Go panic now exits 5 instead of 2, and `pawl hook` stays fail-open and never exits 2. `pawl validate` now prints validator errors to stderr. `pawl status --json` gains `schema_version: 1`; its `workflow` is now the name `pawl run` accepts (or "" when the file no longer resolves to one) and the absolute path moved to the new `workflow_path`; with several live runs and no `--run`, `--json` lists them all with exit 0. `pawl list` prints TSV (`name`, `repo-local|user`, absolute path), omitting user workflows shadowed by a repo-local one. `pawl run` now refuses with exit 4, naming both versions, when the binary does not match the Claude Code plugin that launched it (the plugin launcher exports `PAWL__PLUGIN_VERSION`; skipped when unset and for `dev` builds). `pawl update` orders pre-release versions by semver precedence (rc.2 before rc.10).'
