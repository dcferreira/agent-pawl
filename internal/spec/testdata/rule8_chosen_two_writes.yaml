workflow: rule8chosentwowrites
start: h
state:
  a: {type: string}
  b: {type: string}
steps:
  - id: h
    kind: human
    question: "Who?"
    options: [alice, bob]
    timeout: 1h
    writes: [a, b]
    outcomes:
      alice: done
      bob: done
      chosen: done
      timeout: done
terminal: {done: {status: ok}}
