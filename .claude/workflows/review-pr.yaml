workflow: review-pr
description: >
  Local, interactive review of an already-open GitHub PR: pick any number of
  reviewers (a Claude subagent, codex, and/or a custom local command) to run
  concurrently, fix what they find, push, and repeat until a review round is
  clean AND CI is green on the head that round reviewed (a CI failure is
  fed back to the fixer as findings). Not a CI check — this is a tool Daniel
  runs on his own machine, from a clean checkout of the PR head, with a
  human step where his judgement is the point. Never posts a GitHub
  approval or review decision; it only fixes and pushes.
start: fetch_pr
# A full round (via prepare_review): prepare_review, fanout_review, its 4
# branches, reviewers_left_tree_clean, review_route, then one of:
#   - `blocking` (-> fix_issues, record_declined, fix_push) — 11 entries to
#     reach fix_push once.
#   - `optional_only` (-> ask_optional, then either take_optional ->
#     fix_issues -> record_declined -> fix_push [13 entries], or
#     skip_optional -> wait_for_ci [11 entries, skipping fix_issues
#     entirely]).
#   - `clean` (-> wait_for_ci directly, shortest path).
# prepare_review's max_visits (10) caps how many of those full rounds can
# happen; the 11th entry is `exhausted` -> blocked.
#
# fix_push's `unchanged` outcome (fix_issues left the tree untouched — only
# declines, no real fixes) does not re-enter review_route (retrying
# reviewers on an unchanged tree is pointless). It goes to unchanged_route,
# which resolves `stuck` (terminal — a genuine not-fixed/partially-fixed
# item is still outstanding, or this round's declines were against a
# failing CI check that will stay red regardless), `ask` (nothing left
# unresolved on a review round, but held minor/nitpick findings —
# ${optional_findings} — were never asked about because this round never
# reached ask_optional), or `to_ci` (nothing left unresolved AND nothing
# held, on to wait_for_ci, the same as `pushed` would once CI is checked).
# check-fix-result.sh (fix_issues' postcondition) guarantees a
# `fixed:`/`partially-fixed:` claim can never reach unchanged_route on an
# unchanged tree, so "nothing left unresolved" here always means "every
# item was declined" — see unchanged-route.sh.
#
# Both `to_ci` and `ask` can introduce a bounded extra cycle beyond the
# round's base, and — unlike before — they can now chain, since `ask` can
# itself lead back through fix_issues to a second `unchanged` that then
# takes the `to_ci`/`ci_failure` cycle:
#   - `to_ci`: unchanged_route -> wait_for_ci -> ci_failure -> fix_issues ->
#     record_declined -> fix_push, which either pushes (back to
#     prepare_review, ending this round) or is `unchanged` again — and by
#     then ci_round is true, so unchanged_route resolves `stuck`
#     unconditionally.
#   - `ask`: unchanged_route -> ask_optional -> skip_optional -> wait_for_ci
#     (optional_findings emptied, same as `to_ci`'s target), or ->
#     take_optional -> fix_issues -> record_declined -> fix_push, which
#     either pushes (ending this round) or is `unchanged` again — and by
#     then take_optional has emptied optional_findings, so this second
#     unchanged_route entry can only resolve `stuck` or `to_ci` (never
#     `ask` again).
# The worst single round chains blocking -> fix_issues(1) unchanged ->
# unchanged_route(1) `ask` -> take_optional -> fix_issues(2) unchanged ->
# unchanged_route(2) `to_ci` -> wait_for_ci -> ci_failure -> fix_issues(3)
# -> record_declined(3) -> fix_push(3) `pushed`: fix_issues/
# record_declined/fix_push entered 3 times, unchanged_route 3 times, in one
# non-terminating round — 23 entries total (8 for
# prepare_review..review_route, 3x3 for fix_issues/record_declined/
# fix_push, 3 for unchanged_route, 1 each for ask_optional/take_optional,
# 1 each for wait_for_ci/ci_failure).
#
# Visit caps: most steps are entered at most once per full round and keep
# the default max_visits (10), the same cap as prepare_review's round cap.
# fix_issues, record_declined, fix_push and unchanged_route are the
# exception: the chained cycles above can enter each of them up to 3 times
# in the same round, so they carry max_visits: 30 (3 x prepare_review's
# 10-round cap) — otherwise they could hit `exhausted` well before the
# documented 10-round cap. ask_optional/take_optional/skip_optional stay at
# the default 10: each is reachable at most once per round (take_optional
# always empties optional_findings, so a round can pass through
# unchanged_route's `ask` at most once). 10 rounds x 23 entries + margin for
# fetch_pr/choose_reviewers/check_reviewers (a choose_reviewers re-ask loop,
# each capped at 10) is under 300, so max_steps is 300.
max_steps: 300

args:
  pr_number: {type: string}
  # A repo with no CI at all: without this, "no checks registered" is
  # treated as not-yet-started and wait_for_ci polls until its timeout.
  allow_no_ci: {type: boolean, default: false}

state:
  vcs: {type: string}
  # owner/repo, resolved once by fetch-pr.sh from origin's remote URL (never
  # from gh's cwd-based inference — a non-colocated jj workspace has no git
  # repo for gh to infer from). Every other gh-using script takes this as an
  # argument (via -R/GH_REPO) instead of guessing.
  repo: {type: string}
  pr_url: {type: string}
  head_sha: {type: string}
  base_branch: {type: string}
  branch: {type: string}
  title: {type: string}
  diff_file: {type: string}
  reviewer_choices: {type: json, default: []}
  findings_claude: {type: json, default: []}
  findings_codex: {type: json, default: []}
  findings_custom: {type: json, default: []}
  findings_docs: {type: json, default: []}
  findings: {type: json, default: []}
  # minor- and nitpick-severity findings (severity: "minor" or "nitpick")
  # review_route peeled off — never sent to fix_issues directly. Held here,
  # carried across rounds (review-route.sh merges each round's fresh
  # minor/nitpick items into what is already held, minus anything
  # declined), until ask_optional asks whether to address them (only
  # reached once a round has no fixable findings at all);
  # take_optional/skip_optional then consume it and reset it to [].
  optional_findings: {type: json, default: []}
  # the user's free-text instructions from ask_optional for this round (may
  # be empty); prepare_review resets it to "" at the start of every round so
  # a note only applies to the round it was given in.
  fix_note: {type: string, default: ""}
  # Path of the JSON file holding every finding declined so far (the
  # fixer's wont-fix items and skipped optional findings), created holding
  # [] by fetch-pr.sh. A file rather than a json state key because it grows
  # every round, and a state key a deterministic step reads is rendered into its
  # one `sh -c` argument and exported as PAWL_<KEY> — each capped at
  # 128 KiB on Linux, so an unbounded list would eventually fail the step
  # with E2BIG. Steps read it with jq --slurpfile or as a context: file.
  declined_file: {type: string}
  # Path of the JSON file snapshotting exactly what fix_issues was last
  # asked to fix, created holding [] by fetch-pr.sh and kept current by
  # whichever step sets `findings` right before fix_issues (review-route.sh's
  # blocking branch, take-optional.sh, ci-failures.sh). A file for the same
  # reason declined_file is one: check-fix-result.sh (fix_issues'
  # postcondition) needs the input findings alongside the (possibly
  # similarly large, up to ~64 KiB for CI) output findings, and a second
  # copy of both on one `sh -c` argument could overflow the 128 KiB
  # MAX_ARG_STRLEN cap.
  fix_input_file: {type: string}
  # The git ref ai_review_codex diffs against (`origin/<base_branch>`,
  # freshly fetched by prepare-review.sh), or "" when codex was not picked
  # or cannot run in this working copy.
  codex_base: {type: string, default: ""}
  round: {type: integer, default: 0}
  # true iff the round in flight was seeded by a failing CI check
  # (ci_failure), false for a review round (prepare_review). Read by
  # unchanged_route to tell a CI-originated decline (CI on this head will
  # stay red regardless) from a review-originated one (safe to check CI).
  ci_round: {type: boolean, default: false}

steps:
  - id: fetch_pr
    kind: deterministic
    run: scripts/fetch-pr.sh ${pr_number} ${run_id}
    writes: [vcs, repo, declined_file, fix_input_file, pr_url, head_sha, base_branch, branch, title]
    postcondition: {all_set: [pr_url, head_sha, repo, declined_file, fix_input_file]}
    next: choose_reviewers

  - id: choose_reviewers          # the one human step that picks the engine(s)
    kind: human
    question: |
      Reviewing "${title}" (${pr_url}). Pick any number of reviewers to run
      concurrently. To add a custom reviewer, type ONE shell command as the
      "Other" answer (there is only one free-text answer; chain several
      tools with ";" inside that one command if you need more).
    options: [claude_subagent, codex]
    multi: true
    timeout: 24h                  # a local tool: Daniel may step away mid-run
    writes: {reviewer_choices: {type: json}}
    outcomes:                      # multi: true always resolves to chosen at
      claude_subagent: check_reviewers # runtime, but the validator still
      codex: check_reviewers           # requires every listed option routed
      chosen: check_reviewers
      timeout: blocked

  # codex review diffs against a git ref, so it cannot run in a working copy
  # that is not a git work tree of its own (a non-colocated jj workspace has
  # .jj and no .git). Refuse the codex pick up front and ask again, rather
  # than failing the fan-out every round or letting its error pass for an
  # empty (clean) review. Bounded by the two steps' default max_visits.
  - id: check_reviewers
    kind: deterministic
    run: scripts/check-reviewers.sh ${reviewer_choices}
    outcomes:
      ok: prepare_review
      codex_needs_git: choose_reviewers

  # Entry point of every FULL round (one that starts from a clean, PR-head
  # checkout) — its max_visits is the cap on those (the default 10, stated
  # explicitly): the 11th entry is `exhausted` -> blocked. It is not the
  # only cycle-breaker in the graph: fix_push's `unchanged` outcome can
  # instead lead to a bounded CI-check side-cycle via unchanged_route
  # without going through prepare_review (see fix_push and unchanged_route
  # below) — that cycle is capped by its own steps' default max_visits.
  #
  # Also writes ci_round = false: reaching prepare_review always starts a
  # fresh review round (never a CI-originated one), which unchanged_route
  # later needs to know. Also resets fix_note to "" — a user's optional-
  # findings instructions apply only to the round ask_optional gave them in.
  #
  # Refuses to start a round unless the working copy is clean and its head
  # is the PR's head, then fetches the PR diff into a file (a hard input:
  # a gh failure or an empty diff fails the step rather than letting the
  # reviewers see nothing and call the PR clean).
  - id: prepare_review
    kind: deterministic
    run: scripts/prepare-review.sh ${vcs} ${pr_number} ${repo} ${base_branch} ${reviewer_choices}
    writes: [head_sha, diff_file, codex_base, ci_round, fix_note]
    postcondition: {all_set: [head_sha, diff_file]}
    max_visits: 10
    next: fanout_review

  - id: fanout_review
    kind: parallel
    branches: [ai_review_claude, ai_review_codex, ai_review_custom, docs_review]
    outcomes:
      success: reviewers_left_tree_clean
      failure: blocked

  # prepare_review checked the tree was clean before the reviewers ran; this
  # checks it again after. ai_review_custom runs an arbitrary user-typed
  # command in the working copy, and fix_push commits EVERYTHING in it, so
  # a cache dir, report file or reformatted source a reviewer leaves behind
  # would otherwise be pushed to the PR as part of "review round N". A dirty
  # tree fails the step (-> blocked); clean it up and resume.
  - id: reviewers_left_tree_clean
    kind: deterministic
    run: "scripts/check-clean.sh ${vcs} 'reviewers_left_tree_clean: the review round left files in the working copy (a custom reviewer writing a cache/report, or a formatter?). fix_push would commit and push them; remove them (or make the reviewer write outside the checkout) and resume:'"
    next: review_route

  # Every branch below is always dispatched (kind: parallel's branches: is a
  # static list — there is no runtime-sized fan-out yet), so a reviewer
  # branch not in reviewer_choices self-filters by returning [] immediately rather than
  # doing real review work. Accepted tradeoff: a cheap, near-instant no-op
  # subagent call per unselected engine, each round.
  #
  # The diff comes in as a plain-file context: entry (${diff_file}, written
  # by prepare_review), not a `!cmd "gh pr diff ..."`: a !cmd that fails
  # degrades silently to empty output, a missing file fails the branch.
  - id: ai_review_claude
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. If "claude_subagent" is not
      in it, immediately return findings_claude: [] and stop. Otherwise:
      adversarially review this PR's diff (in context) against
      ${base_branch}. The GitHub repo is ${repo}; pass -R ${repo} to any
      `gh pr diff`/`gh pr view` call (the working copy has no git repo for
      gh to infer it from). Cold (you did not write this change) and
      read-only (analysis only, never edit files). Return findings as a
      JSON array of
      {file, line, category, description, fix, severity}, category one of:
      bug | missing-test | other | performance | security |
      standards-violation | type-annotation. severity is one of:
        - "critical": a security hole, data loss, or a destructive action
          (e.g. rewriting a branch), or the main use case is completely
          broken.
        - "major": wrong behaviour on the normal path, or a realistic
          failure mode that breaks the run.
        - "medium": wrong behaviour in a plausible but less common
          situation, or misleading output.
        - "minor": a real but narrow problem: unusual setup, rare timing or
          crash windows, small robustness gaps.
        - "nitpick": style, naming, comments, wording, polish. Nothing
          behaves wrongly.
      Classify honestly; do not inflate or deflate severity.

      Findings the fixer already declined, with its reasons, are the JSON
      array in ${declined_file} (in context). Do not re-raise any of them
      unless you believe the decline reason is wrong — in that case,
      re-raise the item and explain in `description` why the reason is
      wrong.
    context:
      - "${diff_file}"
      - "${declined_file}"
    subagent_args: {tools: [Read, "Bash(gh pr diff:*)", "Bash(gh pr view:*)"], model: opus}
    writes: {findings_claude: {type: json}}
    postcondition: "printf '%s' ${findings_claude} | jq -e 'type==\"array\"' >/dev/null"

  - id: ai_review_codex
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. If "codex" is not in it,
      immediately return findings_codex: [] and stop. Otherwise: run
      `codex review --base ${codex_base}` (Bash tool) in the working copy,
      which is checked out at the PR head. codex review needs a git
      repository — it diffs against that git ref (origin's
      ${base_branch}, freshly fetched by prepare_review) — and
      check_reviewers only lets "codex" through when the working copy is a
      git work tree. Normalize its output into the same findings shape as
      above (file, line, category, description, fix, severity).

      If codex_base above is empty, or `codex review` does not run to
      completion (not installed, not a git repository, an unknown ref, an
      auth or network error, a crash), that is a FAILED review, never a
      clean one: do NOT return findings_codex: []. Return findings_codex as
      a JSON object (not an array) {"error": "<what failed, with codex's
      error output>"}, which fails this step's postcondition and so the
      fan-out, visibly. [] means codex ran and found nothing. The GitHub
      repo is ${repo}; pass -R ${repo} to any `gh pr diff`/`gh pr view`
      call. severity is one of:
        - "critical": a security hole, data loss, or a destructive action
          (e.g. rewriting a branch), or the main use case is completely
          broken.
        - "major": wrong behaviour on the normal path, or a realistic
          failure mode that breaks the run.
        - "medium": wrong behaviour in a plausible but less common
          situation, or misleading output.
        - "minor": a real but narrow problem: unusual setup, rare timing or
          crash windows, small robustness gaps.
        - "nitpick": style, naming, comments, wording, polish. Nothing
          behaves wrongly.
      Classify honestly; do not inflate or deflate severity.

      Once you know you are actually running (reviewer_choices includes
      "codex"): findings the fixer already declined, with its reasons, are
      the JSON array in ${declined_file} (in context). Do not re-raise any
      of them unless you believe the decline reason is wrong — in that
      case, re-raise the item and explain in `description` why the reason
      is wrong.
    context:
      - "${declined_file}"
    subagent_args: {tools: [Read, "Bash(codex review:*)", "Bash(gh pr diff:*)"], model: haiku}
    writes: {findings_codex: {type: json}}
    postcondition: "printf '%s' ${findings_codex} | jq -e 'type==\"array\"' >/dev/null"

  - id: ai_review_custom
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. An entry that is not
      "claude_subagent" or "codex" is the custom shell command Daniel typed
      as the free-text "Other" answer (at most one such entry). Run it once,
      as a single command (Bash tool), in the working copy (checked out at
      the PR head), and normalize whatever it prints into the same findings
      shape as above (file, line, category, description, fix, severity).
      Leave the working copy exactly as you found it: do not edit files,
      and if the command wrote files into the checkout (a cache dir, a
      report, a formatter rewriting sources), say so in a finding — the
      next step (reviewers_left_tree_clean) fails the round on a dirty tree
      rather than letting fix_push commit those files to the PR.
      severity is one of:
        - "critical": a security hole, data loss, or a destructive action
          (e.g. rewriting a branch), or the main use case is completely
          broken.
        - "major": wrong behaviour on the normal path, or a realistic
          failure mode that breaks the run.
        - "medium": wrong behaviour in a plausible but less common
          situation, or misleading output.
        - "minor": a real but narrow problem: unusual setup, rare timing or
          crash windows, small robustness gaps.
        - "nitpick": style, naming, comments, wording, polish. Nothing
          behaves wrongly.
      Classify honestly; do not inflate or deflate severity. If there
      is no such entry, immediately return findings_custom: [] and stop.

      Once you know you are actually running (there is such an entry):
      findings the fixer already declined, with its reasons, are the JSON
      array in ${declined_file} (in context). Do not re-raise any of them
      unless you believe the decline reason is wrong — in that case,
      re-raise the item and explain in `description` why the reason is
      wrong.
    context:
      - "${declined_file}"
    subagent_args: {tools: [Read, Bash], model: haiku}
    writes: {findings_custom: {type: json}}
    postcondition: "printf '%s' ${findings_custom} | jq -e 'type==\"array\"' >/dev/null"

  # Always runs, whatever reviewers were picked, and again every round — a
  # fix round can stale the docs as easily as the original change did.
  - id: docs_review
    kind: agentic
    description: |
      Check whether documentation that ALREADY EXISTS in this repo has been
      made inaccurate by this PR's changes (diff in context, against
      ${base_branch}). Look through the repo's docs — README, docs/,
      AGENTS.md/CLAUDE.md, design docs, skill files, example NOTES — for
      statements that were true before this change and are false or stale
      after it: renamed commands or flags, changed behaviour, removed or
      moved files, altered defaults, status claims the change invalidates.
      Do NOT flag missing documentation for anything new the PR adds, and do
      not suggest new sections — only existing text that is now wrong.
      Read-only, never edit files. Return findings as a JSON array of
      {file, line, category: "stale-docs", description, fix, severity}:
      file/line point at the stale doc text, description quotes the stale
      claim and names the change that invalidated it, fix is the minimal
      edit to make it true again. severity is one of: critical | major |
      medium | minor | nitpick (same scale the other reviewers use — a
      security hole/data loss/destructive action/completely-broken main
      use case is critical, down through nitpick: style/wording/polish with
      nothing behaving wrongly). Stale existing docs are never below
      "minor" — even a small stale claim is at least minor, never a
      nitpick. Classify honestly; do not inflate or deflate severity.
      Return [] if nothing existing went stale. The GitHub repo is ${repo};
      pass -R ${repo} to any `gh pr diff`/`gh pr view` call (the working
      copy has no git repo for gh to infer it from).

      Findings the fixer already declined, with its reasons, are the JSON
      array in ${declined_file} (in context). Do not re-raise any of them
      unless you believe the decline reason is wrong — in that case,
      re-raise the item and explain in `description` why the reason is
      wrong.
    context:
      - "${diff_file}"
      - "${declined_file}"
    subagent_args: {tools: [Read, Grep, Glob, "Bash(gh pr diff:*)", "Bash(gh pr view:*)"], model: sonnet}
    writes: {findings_docs: {type: json}}
    postcondition: "printf '%s' ${findings_docs} | jq -e 'type==\"array\"' >/dev/null"

  - id: review_route
    kind: deterministic
    run: scripts/review-route.sh ${findings_claude} ${findings_codex} ${findings_custom} ${findings_docs} ${optional_findings} ${declined_file} ${fix_input_file}
    writes: [findings, optional_findings]
    outcomes:
      blocking: fix_issues        # critical, major, or medium — plus missing/unrecognised severity (fail-safe)
      optional_only: ask_optional # nothing fixable, but at least one minor or nitpick — ask before touching anything
      clean: wait_for_ci          # nothing fixable and no minor/nitpick findings at all — clean is not done until CI is green on this head

  # Reached only when review_route found nothing fixable this round but did
  # find minor- or nitpick-severity items — asks whether to address them
  # before moving on, since an optional-findings round would otherwise be
  # silently dropped.
  - id: ask_optional
    kind: human
    question: |
      No findings above minor severity on "${title}" (${pr_url}). These
      minor/nitpick items were raised this round (minor first, then
      nitpick): ${optional_findings}

      Address them now, or skip them for this PR? Free text (the "Other"
      answer) can give instructions instead — e.g. which of them to fix, or
      how — and will be passed to the fixer as this round's instructions.
    options: [address, skip]
    timeout: 24h
    writes: [fix_note]
    outcomes:
      address: take_optional
      skip: skip_optional
      chosen: take_optional        # free-text instructions land in fix_note
      timeout: blocked

  # Turns the held minor/nitpick findings into the findings fix_issues
  # fixes, and empties the held list (they are being acted on now; one
  # fix_issues leaves not-fixed is raised again by the reviewers like any
  # other finding). fix_note (the "address" pick's label, or the free-text
  # instructions from ask_optional) is read by fix_issues itself, not here.
  - id: take_optional
    kind: deterministic
    run: scripts/take-optional.sh ${fix_input_file} ${optional_findings}
    writes: [findings, optional_findings]
    postcondition: "printf '%s' ${findings} | jq -e 'type==\"array\"' >/dev/null"
    next: fix_issues

  # The user chose not to address the held minor/nitpick findings: fold
  # them into the declined file (so they don't get raised again next
  # round), empty the held list, and move on to CI without ever
  # dispatching fix_issues.
  - id: skip_optional
    kind: deterministic
    run: scripts/skip-optional.sh ${declined_file} ${optional_findings}
    writes: [optional_findings]
    postcondition: "jq -e 'type==\"array\"' ${declined_file} >/dev/null"
    next: wait_for_ci

  - id: fix_issues
    kind: agentic
    description: |
      Fix this round's findings. They are (a JSON array of
      {file, line, category, description, fix} items — review findings,
      held minor/nitpick items, or failing CI checks with their log tails):

      ${findings}

      Instructions from the user for this round (may be empty): ${fix_note}
      The user's instructions override the findings' suggested fixes and
      which items to address.

      Treat each suggested fix as a reviewer's suggestion, not a
      requirement: make the simplest correct fix, or leave an item unfixed
      (and say why) if it is wrong. Run the repo's own verify command (or
      its test suite) as your feedback loop, and iterate until it passes or
      further local iteration clearly won't help. Never commit or push —
      the next step does that.

      Return EVERY item you were given, in your findings — none may be
      dropped, even if you address none of them (an empty [] is only valid
      if you were given no items at all). Each item gets an added
      verify_status, whose value must start with one of these four
      prefixes:
        - `fixed:` — you made a change to the tree and verified it. Only
          valid if the working copy actually changed. If an item needed no
          change (it was already resolved), report it as
          `wont-fix: already resolved` instead — never `fixed:` with
          nothing to show for it.
        - `partially-fixed:` — you made part of the change (the tree
          changed); say what's left.
        - `not-fixed:` — you tried and couldn't; it will be raised again
          next round, and that's intended.
        - `wont-fix: <reason>` — you're declining this finding: it's wrong,
          not applicable, already resolved, or out of scope for this repo.
          The reason is mandatory and travels with the finding so reviewers
          don't re-raise it without cause.
      This is independently checked, not taken on your word: the working
      copy's actual diff is inspected, and any `fixed:`/`partially-fixed:`
      claim alongside no uncommitted changes at all is rejected — you will
      be asked to correct it and resubmit.
    subagent_args: {tools: [Read, Edit, Write, Bash]}
    writes: {findings: {type: json}}
    postcondition: scripts/check-fix-result.sh ${vcs} ${findings} ${fix_input_file}
    soft: true                     # the agent's own claim, not independently re-verified for *quality* — only checked for consistency (check-fix-result.sh)
    attempts: 3
    max_visits: 30                 # entered up to 3 times in a round via the ask/to_ci cycles (see top)
    next: record_declined

  # Carries forward every finding fix_issues just declined (verify_status
  # starting "wont-fix"), merged with whatever was already declined in
  # earlier rounds, deduplicated on (file, category, description), into
  # ${declined_file} — so review_route can filter re-raised-but-declined
  # findings out before deciding blocking/clean, and cold reviewers next
  # round are told what not to re-raise without cause.
  - id: record_declined
    kind: deterministic
    run: scripts/record-declined.sh ${declined_file} ${findings}
    postcondition: "jq -e 'type==\"array\"' ${declined_file} >/dev/null"
    max_visits: 30                 # entered up to 3 times in a round via the ask/to_ci cycles (see top)
    next: fix_push

  - id: fix_push
    kind: deterministic
    run: scripts/fix-push.sh ${vcs} ${branch} ${round}
    emits: pairs                   # a bare integer — safe under the whitespace-split grammar
    writes: [round]
    postcondition: scripts/verify-pushed.sh ${vcs} ${branch} ${repo}
    max_visits: 30                 # entered up to 3 times in a round via the ask/to_ci cycles (see top)
    outcomes:
      pushed: prepare_review       # re-review the new head; CI runs meanwhile
      # The fixer changed nothing in the tree. That's expected when this
      # round's only non-fixes were declines (wont-fix — check-fix-result.sh
      # rejects a fixed:/partially-fixed: claim on an unchanged tree, so
      # that's the only way to get here), since declining doesn't touch the
      # tree — but retrying is pointless when nothing actually changed, so
      # this no longer loops back to review_route: unchanged_route decides
      # whether anything is left worth another round (`stuck`), whether held
      # optional findings still need asking about (`ask`), or this was a
      # review round with nothing left unresolved and nothing held, safe to
      # send on to CI (`to_ci`).
      unchanged: unchanged_route

  - id: unchanged_route
    kind: deterministic
    run: scripts/unchanged-route.sh ${findings} ${ci_round} ${optional_findings}
    max_visits: 30                 # entered up to 3 times in a round via the ask/to_ci cycles (see top)
    outcomes:
      to_ci: wait_for_ci
      ask: ask_optional             # held minor/nitpick findings never asked about this round
      stuck: stuck

  - id: wait_for_ci
    kind: wait
    poll: scripts/poll-ci.sh ${pr_number} ${head_sha} ${allow_no_ci} ${repo}
    every: 30s
    timeout: 2h
    outcomes:
      SUCCESS: done
      FAILURE: ci_failure
      timeout: blocked

  - id: ci_failure
    kind: deterministic
    run: scripts/ci-failures.sh ${pr_number} ${head_sha} ${repo} ${fix_input_file}
    # fix_note is reset to "": ask_optional's answer (e.g. "skip", or free
    # text) was about the held optional findings, not these CI failures.
    writes: [findings, ci_round, fix_note]
    next: fix_issues

terminal:
  done: {status: ok, message: "Clean per ${reviewer_choices}, CI green on ${head_sha} — ${pr_url}. Declined or skipped: see ${declined_file}"}
  blocked: {status: blocked, message: "Paused: ${blocked_reason}"}
  stuck: {status: blocked, message: "The fixer changed nothing on ${head_sha} — findings were left unfixed or declined failing CI checks. A human needs to look. Declined or skipped: see ${declined_file}"}
