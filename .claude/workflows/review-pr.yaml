workflow: review-pr
description: >
  Local, interactive review of an already-open GitHub PR: pick any number of
  reviewers (a Claude subagent, codex, and/or a custom local command) to run
  concurrently, fix what they find, push, and repeat until a review round is
  clean AND CI is green on the head that round reviewed (a CI failure is
  fed back to the fixer as findings). Not a CI check — this is a tool Daniel
  runs on his own machine, from a clean checkout of the PR head, with a
  human step where his judgement is the point. Never posts a GitHub
  approval or review decision; it only fixes and pushes.
start: fetch_pr
# A full round (via prepare_review): prepare_review, fanout_review, its 4
# branches, review_route, fix_issues, record_declined, fix_push — 9 entries.
# prepare_review's max_visits (10) still caps how many of those full rounds
# can happen. But fix_push's `unchanged` outcome now re-enters review_route
# directly (declines got filtered out, nothing else changed — see fix_push
# below), without going through prepare_review: that inner loop
# (review_route -> fix_issues -> record_declined -> fix_push -> review_route)
# is capped instead by review_route's own default max_visits (10) — a budget
# it shares with the full-round path, since every full round also enters
# review_route once. Worst case is bounded well short of infinite (at most
# 10 prepare_review rounds and, independently, at most 10 review_route
# entries total), but the two caps together can add up to more entries than
# a single 10-round accounting would suggest, so max_steps has headroom
# above the "10 rounds x ~9 steps" estimate rather than being sized exactly
# to it.
max_steps: 150

args:
  pr_number: {type: string}
  # A repo with no CI at all: without this, "no checks registered" is
  # treated as not-yet-started and wait_for_ci polls until its timeout.
  allow_no_ci: {type: boolean, default: false}

state:
  vcs: {type: string}
  pr_url: {type: string}
  head_sha: {type: string}
  base_branch: {type: string}
  branch: {type: string}
  title: {type: string}
  diff_file: {type: string}
  reviewer_choices: {type: json, default: []}
  findings_claude: {type: json, default: []}
  findings_codex: {type: json, default: []}
  findings_custom: {type: json, default: []}
  findings_docs: {type: json, default: []}
  findings: {type: json, default: []}
  declined: {type: json, default: []}
  round: {type: integer, default: 0}

steps:
  - id: fetch_pr
    kind: deterministic
    run: scripts/fetch-pr.sh ${pr_number}
    writes: [vcs, pr_url, head_sha, base_branch, branch, title]
    postcondition: {all_set: [pr_url, head_sha]}
    next: choose_reviewers

  - id: choose_reviewers          # the one human step that picks the engine(s)
    kind: human
    question: |
      Reviewing "${title}" (${pr_url}). Pick any number of reviewers to run
      concurrently. To add a custom reviewer, type ONE shell command as the
      "Other" answer (there is only one free-text answer; chain several
      tools with ";" inside that one command if you need more).
    options: [claude_subagent, codex]
    multi: true
    timeout: 1h
    writes: {reviewer_choices: {type: json}}
    outcomes:                      # multi: true always resolves to chosen at
      claude_subagent: prepare_review  # runtime, but the validator still
      codex: prepare_review            # requires every listed option routed
      chosen: prepare_review
      timeout: blocked

  # Entry point of every FULL round (one that starts from a clean, PR-head
  # checkout) — its max_visits is the cap on those (the default 10, stated
  # explicitly): the 11th entry is `exhausted` -> blocked. It is no longer
  # the only cycle-breaker in the graph: fix_push's `unchanged` outcome
  # re-enters review_route directly, skipping prepare_review entirely (see
  # fix_push below), so that inner loop is capped by review_route's own
  # default max_visits instead. Every other step in the full-round cycle is
  # still entered at most once per round, so their own default caps of 10
  # can never bind first on that path.
  #
  # Refuses to start a round unless the working copy is clean and its head
  # is the PR's head, then fetches the PR diff into a file (a hard input:
  # a gh failure or an empty diff fails the step rather than letting the
  # reviewers see nothing and call the PR clean).
  - id: prepare_review
    kind: deterministic
    run: scripts/prepare-review.sh ${vcs} ${pr_number}
    writes: [head_sha, diff_file]
    postcondition: {all_set: [head_sha, diff_file]}
    max_visits: 10
    next: fanout_review

  - id: fanout_review
    kind: parallel
    branches: [ai_review_claude, ai_review_codex, ai_review_custom, docs_review]
    outcomes:
      success: review_route
      failure: blocked

  # Every branch below is always dispatched (kind: parallel's branches: is a
  # static list — there is no runtime-sized fan-out yet), so a reviewer
  # branch not in reviewer_choices self-filters by returning [] immediately rather than
  # doing real review work. Accepted tradeoff: a cheap, near-instant no-op
  # subagent call per unselected engine, each round.
  #
  # The diff comes in as a plain-file context: entry (${diff_file}, written
  # by prepare_review), not a `!cmd "gh pr diff ..."`: a !cmd that fails
  # degrades silently to empty output, a missing file fails the branch.
  - id: ai_review_claude
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. If "claude_subagent" is not
      in it, immediately return findings_claude: [] and stop. Otherwise:
      adversarially review this PR's diff (in context) against
      ${base_branch}. Cold (you did not write this change) and read-only
      (analysis only, never edit files). Return findings as a JSON array of
      {file, line, category, description, fix}, category one of:
      bug | missing-test | other | performance | security |
      standards-violation | type-annotation.

      Findings the fixer already declined, with its reasons, are ${declined}.
      Do not re-raise any of them unless you believe the decline reason is
      wrong — in that case, re-raise the item and explain in `description`
      why the reason is wrong.
    context:
      - "${diff_file}"
    subagent_args: {tools: [Read, "Bash(gh pr diff:*)", "Bash(gh pr view:*)"], model: opus}
    writes: {findings_claude: {type: json}}
    postcondition: "printf '%s' ${findings_claude} | jq -e 'type==\"array\"' >/dev/null"

  - id: ai_review_codex
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. If "codex" is not in it,
      immediately return findings_codex: [] and stop. Otherwise: run
      `codex review --base ${base_branch}` (Bash tool) against this PR (the
      working copy is checked out at the PR head) and normalize its output
      into the same findings shape as above (file, line, category,
      description, fix).

      Once you know you are actually running (reviewer_choices includes
      "codex"): findings the fixer already declined, with its reasons, are
      ${declined}. Do not re-raise any of them unless you believe the
      decline reason is wrong — in that case, re-raise the item and explain
      in `description` why the reason is wrong.
    subagent_args: {tools: [Read, "Bash(codex review:*)", "Bash(gh pr diff:*)"], model: haiku}
    writes: {findings_codex: {type: json}}
    postcondition: "printf '%s' ${findings_codex} | jq -e 'type==\"array\"' >/dev/null"

  - id: ai_review_custom
    kind: agentic
    description: |
      reviewer_choices is ${reviewer_choices}. An entry that is not
      "claude_subagent" or "codex" is the custom shell command Daniel typed
      as the free-text "Other" answer (at most one such entry). Run it once,
      as a single command (Bash tool), in the working copy (checked out at
      the PR head), and normalize whatever it prints into the same findings
      shape as above. If there is no such entry, immediately return
      findings_custom: [] and stop.

      Once you know you are actually running (there is such an entry):
      findings the fixer already declined, with its reasons, are ${declined}.
      Do not re-raise any of them unless you believe the decline reason is
      wrong — in that case, re-raise the item and explain in `description`
      why the reason is wrong.
    subagent_args: {tools: [Read, Bash], model: haiku}
    writes: {findings_custom: {type: json}}
    postcondition: "printf '%s' ${findings_custom} | jq -e 'type==\"array\"' >/dev/null"

  # Always runs, whatever reviewers were picked, and again every round — a
  # fix round can stale the docs as easily as the original change did.
  - id: docs_review
    kind: agentic
    description: |
      Check whether documentation that ALREADY EXISTS in this repo has been
      made inaccurate by this PR's changes (diff in context, against
      ${base_branch}). Look through the repo's docs — README, docs/,
      AGENTS.md/CLAUDE.md, design docs, skill files, example NOTES — for
      statements that were true before this change and are false or stale
      after it: renamed commands or flags, changed behaviour, removed or
      moved files, altered defaults, status claims the change invalidates.
      Do NOT flag missing documentation for anything new the PR adds, and do
      not suggest new sections — only existing text that is now wrong.
      Read-only, never edit files. Return findings as a JSON array of
      {file, line, category: "stale-docs", description, fix}: file/line
      point at the stale doc text, description quotes the stale claim and
      names the change that invalidated it, fix is the minimal edit to make
      it true again. Return [] if nothing existing went stale.

      Findings the fixer already declined, with its reasons, are ${declined}.
      Do not re-raise any of them unless you believe the decline reason is
      wrong — in that case, re-raise the item and explain in `description`
      why the reason is wrong.
    context:
      - "${diff_file}"
    subagent_args: {tools: [Read, Grep, Glob, "Bash(gh pr diff:*)", "Bash(gh pr view:*)"], model: sonnet}
    writes: {findings_docs: {type: json}}
    postcondition: "printf '%s' ${findings_docs} | jq -e 'type==\"array\"' >/dev/null"

  - id: review_route
    kind: deterministic
    run: scripts/review-route.sh ${findings_claude} ${findings_codex} ${findings_custom} ${findings_docs} ${declined}
    writes: [findings]
    outcomes:
      blocking: fix_issues
      clean: wait_for_ci           # clean is not done until CI is green on this head

  - id: fix_issues
    kind: agentic
    description: |
      Fix this round's findings. They are (a JSON array of
      {file, line, category, description, fix} items — review findings, or
      failing CI checks with their log tails):

      ${findings}

      Treat each suggested fix as a reviewer's suggestion, not a
      requirement: make the simplest correct fix, or leave an item unfixed
      (and say why) if it is wrong. Run the repo's own verify command (or
      its test suite) as your feedback loop, and iterate until it passes or
      further local iteration clearly won't help. Never commit or push —
      the next step does that. Return findings: the same items, each with an
      added verify_status, whose value must start with one of these four
      prefixes:
        - `fixed:` — you made the change and verified it.
        - `partially-fixed:` — you made part of the change; say what's left.
        - `not-fixed:` — you tried and couldn't; it will be raised again
          next round, and that's intended.
        - `wont-fix: <reason>` — you're declining this finding: it's wrong,
          not applicable, or out of scope for this repo. The reason is
          mandatory and travels with the finding so reviewers don't re-raise
          it without cause.
    subagent_args: {tools: [Read, Edit, Write, Bash]}
    writes: {findings: {type: json}}
    postcondition: "printf '%s' ${findings} | jq -e 'all(.[]; has(\"verify_status\"))' >/dev/null"
    soft: true                     # the agent's own claim, not independently re-verified here
    attempts: 3
    next: record_declined

  # Carries forward every finding fix_issues just declined (verify_status
  # starting "wont-fix"), merged with whatever was already declined in
  # earlier rounds, deduplicated on (file, category, description) — so
  # review_route can filter re-raised-but-declined findings out before
  # deciding blocking/clean, and cold reviewers next round are told what not
  # to re-raise without cause.
  - id: record_declined
    kind: deterministic
    run: scripts/record-declined.sh ${declined} ${findings}
    writes: [declined]
    postcondition: "printf '%s' ${declined} | jq -e 'type==\"array\"' >/dev/null"
    next: fix_push

  - id: fix_push
    kind: deterministic
    run: scripts/fix-push.sh ${vcs} ${branch} ${round}
    emits: pairs                   # a bare integer — safe under the whitespace-split grammar
    writes: [round]
    postcondition: scripts/verify-pushed.sh ${vcs} ${branch}
    outcomes:
      pushed: prepare_review       # re-review the new head; CI runs meanwhile
      # The fixer changed nothing in the tree. That's expected when this
      # round's only non-fixes were declines (wont-fix), since declining
      # doesn't touch the tree: route back to review_route, which now
      # re-filters findings against the just-updated ${declined} and, if
      # nothing genuinely unfixed remains, resolves `clean`. If real
      # not-fixed items remain, review_route resolves `blocking` and we're
      # back in fix_issues, bounded by its own default max_visits/attempts.
      unchanged: review_route

  - id: wait_for_ci
    kind: wait
    poll: scripts/poll-ci.sh ${pr_number} ${head_sha} ${allow_no_ci}
    every: 30s
    timeout: 2h
    outcomes:
      SUCCESS: done
      FAILURE: ci_failure
      timeout: blocked

  - id: ci_failure
    kind: deterministic
    run: scripts/ci-failures.sh ${pr_number} ${head_sha}
    writes: [findings]
    next: fix_issues

terminal:
  done: {status: ok, message: "Clean per ${reviewer_choices}, CI green on ${head_sha} — ${pr_url}"}
  blocked: {status: blocked, message: "Paused: ${blocked_reason}"}
