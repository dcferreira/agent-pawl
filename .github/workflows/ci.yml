name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make fmt` rewrites files, which would pass silently in CI; this gate
      # only reports what is unformatted and fails if anything is.
      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      # staticcheck is a much stricter gate than `go vet` alone. The version is
      # pinned inside the Makefile target (via `go run`), so a fresh clone
      # needs only Go and CI needs no separate install step.
      - name: Staticcheck
        run: make staticcheck

      # Fails if go.mod/go.sum have drifted from actual imports.
      - name: Verify go.mod/go.sum are tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test (unit + e2e)
    runs-on: ubuntu-latest
    # Set only in our own CI, once jj is installed below — never rely on the
    # generic CI env var GitHub Actions sets automatically, since a
    # git-only contributor could have CI set in their own shell for
    # unrelated reasons and this project must not require jj locally.
    env:
      PAWL_REQUIRE_VCS_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The green-tests example's run-tests.sh shells out to jq; it is
      # preinstalled on ubuntu-latest, installed here so a runner image change
      # fails loudly at setup rather than mid-suite.
      - name: Install jq
        run: sudo apt-get install -y jq

      # jj (Jujutsu) is not packaged for apt, and internal/journal's
      # TestResolveRoot_JJWorkspace needs a real `jj` binary on PATH to cover
      # the jj-workspace branch of root resolution (see mustRun in
      # internal/journal/root_test.go) instead of silently skipping. Pinned
      # to a release verified to exist (checked via `gh api
      # repos/jj-vcs/jj/releases/latest` at authoring time) rather than
      # tracking `latest`, for reproducibility.
      - name: Install jj
        run: |
          set -euo pipefail
          version=0.45.1
          curl -sSL -o /tmp/jj.tar.gz \
            "https://github.com/jj-vcs/jj/releases/download/v${version}/jj-v${version}-x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/jj.tar.gz -C /tmp jj
          sudo install -m 0755 /tmp/jj /usr/local/bin/jj
          jj --version

      - name: Test
        run: make test

      # The engine has a lock file, journal replay, and a two-process
      # handshake (`pawl run` / `pawl submit` touching the same run
      # directory) — exactly the shape where data races hide. Runs alongside
      # the plain `make test` rather than replacing it: -race is slower and
      # doesn't change which non-instrumented-path bugs the plain run alone
      # would catch, so both are cheap insurance for different failure
      # modes.
      - name: Test (race detector)
        run: make test-race
