name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make fmt` rewrites files, which would pass silently in CI; this gate
      # only reports what is unformatted and fails if anything is.
      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

  test:
    name: Test (unit + e2e)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The green-tests example's run-tests.sh shells out to jq; it is
      # preinstalled on ubuntu-latest, installed here so a runner image change
      # fails loudly at setup rather than mid-suite.
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Test
        run: make test
