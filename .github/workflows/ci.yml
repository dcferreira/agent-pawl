name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # `make fmt` rewrites files, which would pass silently in CI; this gate
      # only reports what is unformatted and fails if anything is.
      - name: Format
        run: make fmt-check

      - name: Vet
        run: make vet

      # staticcheck is a much stricter gate than `go vet` alone. The version is
      # pinned inside the Makefile target (via `go run`), so a fresh clone
      # needs only Go and CI needs no separate install step.
      - name: Staticcheck
        run: make staticcheck

      # Fails if go.mod/go.sum have drifted from actual imports.
      - name: Verify go.mod/go.sum are tidy
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code go.mod go.sum

      # Validates .claude-plugin/plugin.json and marketplace.json. The
      # Claude Code CLI isn't preinstalled on GitHub-hosted runners, so it's
      # fetched from npm (ubuntu-latest ships Node.js/npm); pinned to a
      # version verified to work offline (no auth/API key needed for
      # `plugin validate`) rather than tracking latest, for reproducibility.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.276

      - name: Validate plugin manifest
        run: claude plugin validate . --strict

  test:
    name: Test (unit + e2e)
    runs-on: ubuntu-latest
    # Guarantees a missing/failing git in internal/journal's VCS tests is a
    # loud failure (t.Fatalf), not a silent skip: git ships on every runner
    # this workflow uses, so its absence here would mean the runner image is
    # broken, not that coverage should quietly shrink. This is scoped to git
    # only — jj is not installed in this job (root resolution has no runtime
    # dependency on either VCS binary; see internal/journal/root.go), so
    # TestResolveRoot_JJWorkspace always skips when jj is missing regardless
    # of this variable. Never rely on the generic CI env var GitHub Actions
    # sets automatically, since a git-only contributor could have CI set in
    # their own shell for unrelated reasons, and this project must not
    # require git or jj for local development.
    env:
      PAWL_REQUIRE_VCS_TOOLS: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The green-tests example's run-tests.sh shells out to jq; it is
      # preinstalled on ubuntu-latest, installed here so a runner image change
      # fails loudly at setup rather than mid-suite.
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Test
        run: make test

      # The engine has a lock file, journal replay, and a two-process
      # handshake (`pawl run` / `pawl submit` touching the same run
      # directory) — exactly the shape where data races hide. Runs alongside
      # the plain `make test` rather than replacing it: -race is slower and
      # doesn't change which non-instrumented-path bugs the plain run alone
      # would catch, so both are cheap insurance for different failure
      # modes.
      - name: Test (race detector)
        run: make test-race

      # install.sh's pure logic (OS/arch detection, asset naming, version
      # handling, checksum parsing) is unit-tested by sourcing it, with no
      # network access — see scripts/test-install.sh.
      - name: Test install.sh
        run: make test-install
