name: Release

# Triggered by a push to main that changes CHANGELOG.md — i.e. a merged
# release PR (release-pr.yml opens release/vX.Y.Z; CHANGELOG.md is the one
# file every release PR always touches, via `changie merge`). This job
# tags vX.Y.Z itself and runs goreleaser with notes from
# .changes/vX.Y.Z.md in the SAME run, rather than reacting to a `v*` tag
# push: a tag pushed with the default GITHUB_TOKEN wouldn't trigger this
# workflow at all (GitHub's anti-recursion rule for the default token), so
# tag-push-triggered was never viable once tagging itself happens in CI.
# workflow_dispatch lets the owner re-run a failed release (e.g. goreleaser
# flaked) without needing a new CHANGELOG.md-touching push.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    # The push trigger above is already scoped to main, but workflow_dispatch
    # can be run from any branch in the Actions UI — without this guard,
    # dispatching from a feature branch would tag and release *that*
    # branch's tip. See docs/releasing.md.
    if: github.ref == 'refs/heads/main'
    # The default GITHUB_TOKEN is read-only content access on this repo,
    # which makes goreleaser's release-publish step fail with "403 Resource
    # not accessible by integration". contents: write is what lets it
    # create the GitHub Release and upload archives/checksums.txt as
    # assets, and lets this job push the vX.Y.Z tag itself.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser needs the full history and all tags to generate the
          # changelog (commits since the previous tag) and resolve the
          # current version; a shallow checkout would only see the latest
          # commit itself.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install changie
        run: go install github.com/miniscruff/changie@v1.26.0

      - name: Resolve the version to release
        run: |
          set -euo pipefail
          echo "VERSION=$(changie latest)" >>"$GITHUB_ENV"

      - name: Sanity-check plugin.json agrees with .changes/
        run: bash scripts/release/check-version-consistency.sh

      - name: Configure git identity for the release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Idempotent across three states — workflow_dispatch (a manual
      # re-run), or a second CHANGELOG.md-touching push before this job got
      # to run, must not blow up trying to recreate something that's
      # already there, and a goreleaser failure after a previous run's tag
      # push must be resumable without re-tagging (git tag -a on an
      # existing tag fails outright — and it would already exist locally
      # here, since checkout's fetch-depth: 0 fetches all tags):
      #   - tag exists, release exists: nothing to do.
      #   - tag exists, no release: a prior run tagged and then failed
      #     before goreleaser published. Don't re-tag; check out the tagged
      #     commit (it needn't be HEAD any more — other PRs may have merged
      #     to main since) so goreleaser runs from the commit that was
      #     actually released, not whatever main has moved to.
      #   - neither exists: tag, push, then run goreleaser. On a manual
      #     workflow_dispatch (not the CHANGELOG.md-touching push this
      #     workflow normally reacts to), refuse unless HEAD is the commit
      #     that last changed CHANGELOG.md — otherwise a dispatch could tag
      #     and release main's current tip, which may carry commits merged
      #     after the release PR under a version those commits were never
      #     part of.
      - name: Tag the release (unless it already exists)
        run: |
          set -euo pipefail

          tag_exists=0
          git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null 2>&1 && tag_exists=1 || true
          release_exists=0
          gh release view "${VERSION}" >/dev/null 2>&1 && release_exists=1 || true

          if [ "$tag_exists" = "1" ] && [ "$release_exists" = "1" ]; then
            # A run that died between goreleaser and the plugin upload leaves
            # a release without the plugin assets: finish that, don't skip.
            if gh release view "${VERSION}" --json assets --jq '.assets[].name' | grep -qx "agent-pawl-plugin_${VERSION#v}.zip" &&
              gh release view "${VERSION}" --json assets --jq '.assets[].name' | grep -qx "marketplace.json"; then
              echo "::notice::${VERSION} is already tagged and released, with its plugin assets — nothing to do."
              echo "SKIP=1" >>"$GITHUB_ENV"
            else
              echo "::notice::${VERSION} is already tagged and released but is missing its plugin assets — checking out the tag and uploading only those."
              git checkout "refs/tags/${VERSION}"
              echo "SKIP_GORELEASER=1" >>"$GITHUB_ENV"
            fi
          elif [ "$tag_exists" = "1" ]; then
            echo "::notice::${VERSION} is already tagged with no release yet — checking out the tag and resuming from goreleaser without re-tagging."
            git checkout "refs/tags/${VERSION}"
          else
            changelog_sha=$(git log -1 --format=%H -- CHANGELOG.md)
            head_sha=$(git rev-parse HEAD)
            if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$changelog_sha" != "$head_sha" ]; then
              echo "::error::Neither tag ${VERSION} nor its release exist, and this is a manual workflow_dispatch run where HEAD (${head_sha}) is not the commit that last changed CHANGELOG.md (${changelog_sha}). Refusing to tag and release main's current tip, which may include commits merged after the release PR. Re-run via 'Re-run failed jobs' on the original run instead, or dispatch from the commit CHANGELOG.md was last changed at." >&2
              exit 1
            fi
            git tag -a "${VERSION}" -m "${VERSION}"
            # This push deliberately triggers nothing further: pushing a tag
            # with the default GITHUB_TOKEN fires no workflow (the same
            # anti-recursion rule this workflow's own trigger comment
            # explains), which is exactly fine here since goreleaser runs
            # right below in this same job.
            git push origin "${VERSION}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Write release notes from .changes/
        if: env.SKIP != '1' && env.SKIP_GORELEASER != '1'
        run: |
          set -euo pipefail
          # Drop the version-file's own header line ("## vX.Y.Z - date");
          # goreleaser's --release-notes file becomes the GitHub Release
          # body as-is.
          tail -n +2 ".changes/${VERSION}.md" >"$RUNNER_TEMP/notes.md"

      # Pinned to match the version verified locally (see .goreleaser.yaml
      # and the packaging PR that introduced it), rather than floating on
      # `latest`, for reproducibility — same rationale as pinning
      # staticcheck's version in the Makefile.
      - name: Run goreleaser
        if: env.SKIP != '1' && env.SKIP_GORELEASER != '1'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes=${{ runner.temp }}/notes.md
        env:
          # Used by goreleaser to publish the GitHub release and upload
          # archives/checksums.txt as its assets.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Plugin-only re-run (release exists, plugin assets don't): goreleaser
      # didn't run in this job, so fetch the archives and checksums.txt it
      # published, which build-plugin-archive.sh then re-verifies.
      - name: Fetch the published archives (plugin-only re-run)
        if: env.SKIP_GORELEASER == '1'
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${VERSION}" --dir dist --pattern 'pawl_*.tar.gz' --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The plugin zip bundles goreleaser's own binaries (checked against
      # checksums.txt first) with the plugin files from this checkout, which
      # is the tagged commit in every path that reaches here. --clobber makes
      # a re-run replace assets rather than fail on them.
      - name: Build and upload the plugin archive and marketplace.json
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          bash scripts/release/build-plugin-archive.sh "${VERSION}" dist dist/plugin
          gh release upload "${VERSION}" \
            "dist/plugin/agent-pawl-plugin_${VERSION#v}.zip" dist/plugin/marketplace.json \
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
